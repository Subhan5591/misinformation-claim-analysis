{% extends "base.html" %}
{% block title %}Oops{% endblock %}
{% block content %}
<section class="panel text-center mt-4">
  <div style="font-size:3.5rem"><i class="bi bi-emoji-frown" style="color:var(--pink)"></i></div>
  <h2>{{ title or 'Something went wrong' }}</h2>
  <p class="text-muted">{{ message or 'Please try again in a moment.' }}</p>
  <a href="{{ url_for('index') }}" class="btn btn-primary"><i class="bi bi-house-door"></i> Back to home</a>
</section>
{% endblock %}
