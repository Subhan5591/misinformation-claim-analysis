<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ClaimLens{% endblock %} – Misinformation Claim Analysis</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}?v=5" rel="stylesheet">
</head>
<body>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"light"}catch(e){}</script>
<nav class="navbar navbar-expand-md sticky-top app-nav">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('index') }}"><i class="bi bi-shield-check"></i>ClaimLens</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint == 'index' }}" href="{{ url_for('index') }}"><i class="bi bi-house-door"></i> Home</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint in ('results', 'latest_result', 'demo') }}" href="{{ url_for('latest_result') }}"><i class="bi bi-bar-chart-line"></i> Results</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint == 'history' }}" href="{{ url_for('history') }}"><i class="bi bi-clock-history"></i> History</a></li>
      </ul>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle dark mode"><i class="bi bi-moon-stars-fill"></i></button>
    </div>
  </div>
</nav>

{% block hero %}{% endblock %}
<main class="container">{% block content %}{% endblock %}</main>
<footer class="app-footer text-center">AI-Based Misinformation Context and Claim Analysis System</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}?v=5"></script>
{% block scripts %}{% endblock %}
</body>
</html>
